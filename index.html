<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Fareed Tareen, DDS — Intro</title>
<meta name="description" content="Intro plate for fareedtareen.com — the FT monogram in 3D. Clinical case studies, research, photography and design by Dr. Fareed Tareen, DDS.">
<meta property="og:type" content="website">
<meta property="og:title" content="Dr. Fareed Tareen, DDS — The FT Mark, in 3D">
<meta property="og:description" content="The FT monogram in 3D. Entry to the portfolio of Dr. Fareed Tareen, DDS.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" id="favicon" href="">
<link rel="apple-touch-icon" id="touchicon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --ink:#fff;
    --line:rgba(255,255,255,.32); --line-soft:rgba(255,255,255,.13);
    --grid:rgba(255,255,255,.045); --dim:rgba(255,255,255,.55);
    --dim2:rgba(255,255,255,.72); --faint:rgba(255,255,255,.40);
    --mono:"Space Mono",ui-monospace,monospace;
    --sans:"Manrope","Helvetica Neue",Arial,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
    --accent:#9aa0a8;
    --panel-bg:rgba(0,0,0,.55);
  }
  body.light{
    --bg:#f4f4f2; --ink:#101114;
    --line:rgba(0,0,0,.35); --line-soft:rgba(0,0,0,.14);
    --grid:rgba(0,0,0,.05); --dim:rgba(0,0,0,.55);
    --dim2:rgba(0,0,0,.72); --faint:rgba(0,0,0,.42);
    --panel-bg:rgba(255,255,255,.6);
    --accent:#6b7078;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative;
    transition:background .5s var(--ease)}
  a{color:inherit;text-decoration:none}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
  canvas{display:block;position:fixed;inset:0;z-index:1}

  #chrome{position:fixed;inset:0;z-index:6;pointer-events:none}
  #chrome .frame{position:absolute;inset:14px;border:1px solid var(--line-soft)}
  #chrome .bk{position:absolute;width:20px;height:20px;border:1.5px solid var(--dim2)}
  #chrome .bk.tl{top:22px;left:22px;border-right:0;border-bottom:0}
  #chrome .bk.tr{top:22px;right:22px;border-left:0;border-bottom:0}
  #chrome .bk.bl{bottom:22px;left:22px;border-right:0;border-top:0}
  #chrome .bk.br{bottom:22px;right:22px;border-left:0;border-top:0}

  header{position:fixed;top:0;left:0;right:0;z-index:8}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:26px 44px 0}
  .brand{display:flex;align-items:center;gap:10px}
  .ftmark{width:26px;height:26px;border:1px solid var(--line);border-radius:50%;overflow:hidden;
    display:grid;place-items:center;background:#000;transition:transform .5s var(--ease)}
  .brand:hover .ftmark{transform:rotate(180deg)}
  .ftmark img{width:100%;height:100%;object-fit:cover}
  .wordmark{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim2)}
  nav#nav ul{display:flex;gap:26px;list-style:none}
  nav#nav a{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--dim);transition:color .3s;position:relative;padding-bottom:3px}
  nav#nav a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--accent);transition:width .35s var(--ease)}
  nav#nav a:hover{color:var(--ink)}
  nav#nav a:hover::after{width:100%}
  .enter{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;
    border:1px solid var(--line);padding:9px 18px;color:var(--ink);background:transparent;cursor:pointer;
    transition:background .35s var(--ease),color .35s,border-color .35s}
  .enter:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  @media(max-width:860px){ nav#nav{display:none} .wordmark{font-size:9px} }

  #title{position:fixed;left:44px;top:96px;z-index:7;pointer-events:none;opacity:0;transform:translateY(8px);
    transition:opacity .9s var(--ease),transform .9s var(--ease)}
  #title.on{opacity:1;transform:none}
  #title .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase}
  #title h1{margin:8px 0 8px;font-weight:800;font-size:clamp(26px,3.6vw,40px);line-height:1.06;letter-spacing:-.01em}
  #title .sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.14em;line-height:1.9}
  #title .rule{width:210px;border-top:1px solid var(--line);margin-top:12px}
  #spec{position:fixed;right:44px;top:96px;z-index:7;text-align:right;pointer-events:none;
    opacity:0;transition:opacity .9s var(--ease) .2s}
  #spec.on{opacity:1}
  #spec .brand{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim2)}
  #spec .lines{margin-top:8px;font-family:var(--mono);font-size:10px;line-height:2.0;color:var(--dim);letter-spacing:.1em}
  @media(max-width:860px){ #title{left:24px;top:84px} #spec{display:none} }

  /* labels + leaders */
  #labels{position:fixed;inset:0;z-index:5;pointer-events:none}
  #leaders{position:absolute;inset:0;width:100%;height:100%}
  .lbl{position:absolute;transform:translateY(-50%);font-family:var(--mono);opacity:0;transition:opacity .6s}
  .lbl .t{font-size:10px;letter-spacing:.2em;color:var(--ink);text-transform:uppercase;white-space:nowrap}
  .lbl .d{font-size:9px;letter-spacing:.12em;color:var(--dim);margin-top:2px;white-space:nowrap}
  .lbl.r{text-align:right;transform:translate(-100%,-50%)}
  @media(max-width:860px){ .lbl .d{display:none} }

  /* caption + CTA */
  #caption{position:fixed;left:50%;bottom:12%;transform:translate(-50%,14px);z-index:7;text-align:center;
    opacity:0;transition:opacity 1s var(--ease),transform 1s var(--ease);pointer-events:none}
  #caption.on{opacity:1;transform:translate(-50%,0)}
  #caption .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.32em;color:var(--dim);text-transform:uppercase;min-height:1.6em}
  #caption .cta{display:inline-block;margin-top:16px;font-family:var(--mono);font-size:10px;letter-spacing:.26em;
    text-transform:uppercase;border:1px solid var(--line);padding:12px 26px;color:var(--ink);
    transition:background .35s var(--ease),color .35s;pointer-events:auto}
  #caption .cta:hover{background:var(--ink);color:var(--bg)}

  #ui{position:fixed;left:44px;bottom:36px;z-index:8;display:flex;gap:8px}
  #ui button{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
    background:transparent;color:var(--dim2);border:1px solid var(--line-soft);padding:8px 14px;cursor:pointer;transition:all .3s}
  #ui button:hover{border-color:var(--ink);color:var(--ink)}
  #cc{position:fixed;right:44px;bottom:36px;z-index:7;text-align:right;pointer-events:none;
    font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--faint);line-height:2;
    opacity:0;transition:opacity 1s var(--ease) .4s}
  #cc.on{opacity:1}
  @media(max-width:860px){ #ui{left:24px;bottom:22px} #cc{display:none} #caption{bottom:15%} }

  #pre{position:fixed;inset:0;background:#000;z-index:20;display:grid;place-items:center;
    transition:opacity .8s var(--ease)}
  #pre.gone{opacity:0;pointer-events:none}
  #pre .pl{font-family:var(--mono);font-size:10px;letter-spacing:.4em;color:rgba(255,255,255,.55);text-transform:uppercase}
  #pre .bar{width:120px;height:1px;background:rgba(255,255,255,.15);margin:14px auto 0;overflow:hidden}
  #pre .bar i{display:block;height:100%;width:40%;background:#fff;animation:slide 1.1s infinite var(--ease)}
  @keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
  #err{position:fixed;left:10px;bottom:10px;z-index:30;color:#ff7a6b;font:10px var(--mono);
    white-space:pre-wrap;display:none;max-width:70vw}
</style>
</head>
<body>

<div id="pre"><div>
  <div class="pl">Machining FT Mark</div>
  <div class="bar"><i></i></div>
</div></div>

<div id="chrome">
  <div class="frame"></div>
  <i class="bk tl"></i><i class="bk tr"></i><i class="bk bl"></i><i class="bk br"></i>
</div>

<header>
  <div class="nav">
    <a class="brand" href="https://fareedtareen.com">
      <span class="ftmark"><img id="brandImg" alt="ft"></span>
      <span class="wordmark">Dr. Fareed Tareen, DDS</span>
    </a>
  </div>
</header>

<div id="caption">
  <div class="tag" id="tagline" data-type="DR. FAREED TAREEN, DDS"></div>
  <br><a class="cta" href="https://fareedtareen.com">Enter Portfolio →</a>
</div>

<div id="err"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="assets/stl-data.js"></script>
<script src="assets/logo-data.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const params = new URLSearchParams(location.search);
const errBox = document.getElementById('err');
function fatal(msg){ errBox.style.display='block'; errBox.textContent += msg + '\n'; }
addEventListener('error', e => fatal('JS: ' + e.message));

/* brand mark + icons from embedded PNG (assets/logo-data.js) */
const logoDataURI = 'data:image/png;base64,' + window.FT_LOGO_B64;
document.getElementById('favicon').href = logoDataURI;
document.getElementById('touchicon').href = logoDataURI;
document.getElementById('brandImg').src = logoDataURI;

let themeWhite = params.get('theme') === 'white';
const BG_DARK = 0x000000, BG_WHITE = 0xf4f4f2;
const ACCENT = 0xb9bec6;

/* ============================ renderer / scene ============================ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.28;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(themeWhite ? BG_WHITE : BG_DARK);
scene.fog = new THREE.Fog(themeWhite ? BG_WHITE : BG_DARK, 180, 520);

const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 600);
camera.position.set(0, 10, 205);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 150;
controls.maxDistance = 280;
controls.enablePan = false;
controls.autoRotate = false;
controls.minPolarAngle = Math.PI * 0.44;   /* gentle tilt range around the face */
controls.maxPolarAngle = Math.PI * 0.56;
controls.minAzimuthAngle = -0.45;
controls.maxAzimuthAngle =  0.45;
controls.target.set(0, 0, 0);
controls.enableDamping = true;

/* -------- procedural studio environment -------- */
function studioEnv(){
  const env = new THREE.Scene();
  env.background = new THREE.Color(0x000000);
  const softTex = (w,h,horiz) => {
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    const x = c.getContext('2d');
    const g = horiz ? x.createLinearGradient(0,0,w,0) : x.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#000'); g.addColorStop(.22,'#888'); g.addColorStop(.5,'#fff');
    g.addColorStop(.78,'#888'); g.addColorStop(1,'#000');
    x.fillStyle=g; x.fillRect(0,0,w,h);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
  };
  const card = (w,h,color,int,pos,rotY=0,rotX=0,tex=null) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h),
      new THREE.MeshBasicMaterial({ color:new THREE.Color(color).multiplyScalar(int), map:tex, side:THREE.DoubleSide }));
    m.position.set(...pos); m.rotation.y=rotY; m.rotation.x=rotX; env.add(m);
  };
  const stripV = softTex(64,512,true), stripH = softTex(512,64,false);
  card(22,10,0xffffff,5.0,[0,16,0],0,Math.PI/2,stripH);          // overhead softbox
  card(3,16,0xffffff,3.6,[-16,4,-4],Math.PI/2.6,0,stripV);       // left strip
  card(3,16,0xffffff,2.8,[16,3,-3],-Math.PI/2.6,0,stripV);       // right strip
  card(14,6,0xffe2c0,1.2,[0,3,-18],0,0,stripH);                  // warm back wall
  card(8,3,0xbfd4ff,0.8,[8,2,16],Math.PI,0,stripH);              // cool front fill
  return env;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(studioEnv(), 0.04).texture;

/* lights */
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(20, 34, 16);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left=-60; key.shadow.camera.right=60;
key.shadow.camera.top=60; key.shadow.camera.bottom=-60;
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0xcfe0ff, 1.2); rim.position.set(-24, 10, -22); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.3));

/* floor: dark disc + blueprint grid */
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(140, 64),
  new THREE.MeshStandardMaterial({ color:0x060608, roughness:0.95, metalness:0.05 })
);
floor.rotation.x = -Math.PI/2; floor.position.y = -36.6; floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(280, 70, 0x3a3f46, 0x2a2e34);
grid.material.transparent = true; grid.material.opacity = themeWhite ? 0.08 : 0.10;
grid.position.y = -36.5;
scene.add(grid);

/* ============================ materials ============================ */
const MAT = {
  brass: new THREE.MeshPhysicalMaterial({
    color:0xC9CDD3, metalness:0.3, roughness:0.34,
    clearcoat:0.6, clearcoatRoughness:0.3
  }),
  chrome: new THREE.MeshPhysicalMaterial({
    color:0xFFFFFF, metalness:0.1, roughness:0.28,
    clearcoat:0.7, clearcoatRoughness:0.2
  }),
  ring: new THREE.MeshBasicMaterial({ color:ACCENT, transparent:true, opacity:0.5 }),
  ringFaint: new THREE.MeshBasicMaterial({ color:0x888888, transparent:true, opacity:0.22 })
};

/* ============================ build the mark ============================ */
const mark = new THREE.Group();       /* assembly choreography */
const spinner = new THREE.Group();    /* slow turntable spin */
mark.add(spinner);
mark.position.y = 8;                  /* lift clear of the caption */
scene.add(mark);

const glow = (m)=>{ m.castShadow = true; m.receiveShadow = false; return m; };

let baseMesh = null, lettersMesh = null, reticle = null, baseMat = null, chromeMat = null;
let assemblyStart = performance.now();

const PARTS = {
  base:    { off: 0,    delay: 0.00 },
  letters: { off: 3.4,  delay: 0.42 },
  reticle: { off: 0,    delay: 0.0  }
};

/* ============================ intro / choreography ============================ */
const timers = [];
const later = (fn,ms)=> timers.push(setTimeout(fn,ms));
const smoothstep = (a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };

/* STL embedded as base64 in assets/stl-data.js — no binary fetch needed */
const b64ToBuf = (b64) => {
  const bin = atob(b64); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
};
const geom = new STLLoader().parse(b64ToBuf(window.FT_STL_B64));
{
  geom.computeBoundingBox();
  const bb = geom.boundingBox;
  const cx = (bb.min.x + bb.max.x)/2, cy = (bb.min.y + bb.max.y)/2;
  geom.translate(-cx, -cy, -bb.min.z);              /* flat on z=0, centered in XY */
  geom.computeVertexNormals();

  /* split the extruded solid into base slab (z<1.1) and letterform (z>=1.1) */
  const baseGeom = geom.clone(); baseGeom.clearGroups();
  const lettGeom = geom.clone(); lettGeom.clearGroups();
  splitSlab(baseGeom, 1.1, false);
  splitSlab(lettGeom, 1.1, true);

  baseMat = MAT.brass.clone(); chromeMat = MAT.chrome.clone();
  baseMesh = glow(new THREE.Mesh(baseGeom, baseMat));
  lettersMesh = glow(new THREE.Mesh(lettGeom, chromeMat));
  spinner.add(baseMesh, lettersMesh);

  document.getElementById('pre').classList.add('gone');
  introReveal();
}

/* keep only triangles whose centroid z satisfies the predicate */
function splitSlab(g, zCut, keepAbove){
  const pos = g.attributes.position;
  const idx = g.index ? g.index.array : null;
  const triCount = idx ? idx.length/3 : pos.count/3;
  const keep = [];
  for (let t=0; t<triCount; t++){
    let zc = 0;
    for (let k=0;k<3;k++){
      const vi = idx ? idx[t*3+k] : t*3+k;
      zc += pos.getZ(vi);
    }
    zc /= 3;
    if (keepAbove ? zc >= zCut : zc < zCut) keep.push(t);
  }
  const n = keep.length;
  const P = new Float32Array(n*9), N = new Float32Array(n*9);
  const srcP = pos.array, srcN = g.attributes.normal.array;
  for (let i=0;i<n;i++){
    const t = keep[i];
    for (let k=0;k<3;k++){
      const vi = idx ? idx[t*3+k] : t*3+k;
      P.set([srcP[vi*3], srcP[vi*3+1], srcP[vi*3+2]], (i*3+k)*3);
      N.set([srcN[vi*3], srcN[vi*3+1], srcN[vi*3+2]], (i*3+k)*3);
    }
  }
  g.setAttribute('position', new THREE.BufferAttribute(P,3));
  g.setAttribute('normal', new THREE.BufferAttribute(N,3));
  g.setIndex(null);
}

/* ============================ choreography (cont.) ============================ */
function introReveal(){
  assemblyStart = performance.now() + 600;      /* assembly begins after a beat */
  later(()=>{ document.getElementById('caption').classList.add('on'); typeIn(document.getElementById('tagline'), 26); }, 2600);
}

function applyAssembly(t){
  /* t: seconds since assembly start */
  const rise = smoothstep(0.0, 1.5, t);                       /* base rises from below */
  const l = smoothstep(PARTS.letters.delay, PARTS.letters.delay + 1.4, t);  /* letters slam down */
  if (baseMesh){ baseMesh.position.z = -50 * (1-rise); baseMesh.scale.z = 0.4 + 0.6*rise; }
  if (lettersMesh){ lettersMesh.position.z = PARTS.letters.off + 20 * (1-l); lettersMesh.scale.z = 0.4 + 0.6*l; }
  if (chromeMat) chromeMat.roughness = 0.50 - 0.36*smoothstep(1.2, 2.6, t);   /* machined finish settles */
  if (baseMat)   baseMat.roughness   = 0.60 - 0.26*smoothstep(0.4, 1.8, t);
  const settled = smoothstep(2.0, 2.8, t);
  spinner.rotation.y = (1-settled) * 0.55;  /* partial turn while assembling */
  return settled;
}

function typeIn(el, speed){
  const text = el.dataset.type;
  el.textContent = '';
  const caret = document.createElement('span'); caret.className = 'caret';
  el.appendChild(caret);
  let i = 0;
  (function step(){
    if (i < text.length){
      caret.before(document.createTextNode(text[i++]));
      timers.push(setTimeout(step, speed + Math.random()*24));
    } else caret.remove();
  })();
}

function replay(){
  timers.forEach(clearTimeout); timers.length = 0;
  assemblyStart = performance.now();
  introReveal();
}


/* ============================ UI / theme / spin ============================ */
let spinning = params.get('spin') !== '0';

function setTheme(white){
  themeWhite = white;
  document.body.classList.toggle('light', white);
  scene.background.set(white ? BG_WHITE : BG_DARK);
  scene.fog.color.set(white ? BG_WHITE : BG_DARK);
  floor.material.color.set(white ? 0xe8e8e4 : 0x0a0a0c);
  grid.material.opacity = white ? 0.10 : 0.16;
}
setTheme(themeWhite);

/* ============================ loop ============================ */
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = (performance.now() - assemblyStart) / 1000;
  const settled = applyAssembly(t);
  if (spinning && settled > 0.5) spinner.rotation.y += dt * 0.35;
  controls.update();
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
